name: Windows

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Generate Version
        shell: cmd
        run: |
          python ci\generate-version.py
          type QtScrcpy\appversion

      - name: Build with CMake
        shell: cmd
        run: |
          mkdir ci\build_temp
          cd ci\build_temp
          cmake -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%\lib\cmake\Qt5" -DCMAKE_BUILD_TYPE=RelWithDebInfo -G "Visual Studio 17 2022" -A x64 ..\..
          cmake --build . --config RelWithDebInfo -j4

      - name: Package
        shell: pwsh
        run: |
          $publishName = "QtScrcpy-AutoConnect-v${{ github.run_number }}-win-x64"
          $publishPath = "ci\build\$publishName"
          New-Item -ItemType Directory -Force -Path $publishPath
          
          # Copy compiled output
          Copy-Item -Path "output\x64\RelWithDebInfo\*" -Destination $publishPath -Recurse -Force
          
          # Copy third party tools and assets
          Copy-Item -Path "QtScrcpy\QtScrcpyCore\src\third_party\adb\win\*" -Destination $publishPath -Force
          Copy-Item -Path "QtScrcpy\QtScrcpyCore\src\third_party\scrcpy-server" -Destination $publishPath -Force
          Copy-Item -Path "keymap" -Destination "$publishPath\keymap" -Recurse -Force
          Copy-Item -Path "config" -Destination "$publishPath\config" -Recurse -Force
          Copy-Item -Path "QtScrcpy\sndcpy\sndcpy.bat" -Destination $publishPath -Force
          Copy-Item -Path "QtScrcpy\sndcpy\sndcpy.apk" -Destination $publishPath -Force

          # Deploy Qt dependencies using windeployqt
          $windeployqt = "$env:QT_ROOT_DIR\bin\windeployqt.exe"
          & $windeployqt "$publishPath\QtScrcpy.exe"
          
          # Cleanup unnecessary Qt files
          Remove-Item -Path "$publishPath\translations" -Recurse -ErrorAction SilentlyContinue
          Remove-Item -Path "$publishPath\iconengines" -Recurse -ErrorAction SilentlyContinue

          # Compress to zip
          Compress-Archive -Path $publishPath -DestinationPath "ci\build\$publishName.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QtScrcpy-AutoConnect-v${{ github.run_number }}-win-x64
          path: ci\build\QtScrcpy-AutoConnect-v${{ github.run_number }}-win-x64